<html lang="ar" dir="rtl">
<head>

<style>
:root{
  --navy:#14213d;--orange:#f07f1b;--ink:#1b1f2a;--muted:#5d6577;--line:#e3e6ec;--bg:#f6f4f0;--card:#fff;--soft:#f1f3f7;
  --green:#1f8a4c;--green-soft:#e5f5ec;--red:#c2402b;--red-soft:#fbe9e5;--blue:#2b5fc2;--blue-soft:#e6eefc;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:-apple-system,"SF Pro Text","SF Arabic","Geeza Pro",system-ui,"Segoe UI",Tahoma,sans-serif;color:var(--ink);font-size:16px;line-height:1.4;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
.head{background:var(--navy);color:#fff;padding:calc(var(--st) + 10px) 18px 14px;flex:none;position:relative}
.head .t{font-size:24px;font-weight:800}
.head .s{font-size:13.5px;color:#aeb8cf;margin-top:1px}
.head .back{background:none;border:none;color:var(--orange);font:inherit;font-weight:700;padding:0 0 4px;cursor:pointer}
.head .act{position:absolute;inset-inline-end:14px;top:calc(var(--st) + 10px);background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:5px 12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(110px + var(--sb))}
.tabbar{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:var(--sb);z-index:3}
.tabbar button{flex:1;height:60px;background:none;border:none;font:inherit;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.tabbar button .i{font-size:21px;line-height:1}
.tabbar button.on{color:var(--orange)}
.fab{position:absolute;inset-inline-end:16px;bottom:calc(74px + var(--sb));background:var(--orange);color:#fff;border:none;border-radius:30px;padding:15px 22px;font:inherit;font-weight:800;font-size:17px;box-shadow:0 6px 16px rgba(240,127,27,.45);cursor:pointer;z-index:2}
.box{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line)}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.money{display:flex;gap:8px;margin-top:6px}
.money div{flex:1;background:var(--soft);border-radius:10px;padding:7px 9px;min-width:0}
.money small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.money b{font-size:18px;font-variant-numeric:tabular-nums}
.sec{font-size:13px;font-weight:800;color:var(--muted);margin:16px 2px 8px}
.item{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:9px;border:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .n{font-weight:700}
.d{font-size:13.5px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.due{background:var(--red-soft);color:var(--red)}
.pill.dig{background:var(--blue-soft);color:var(--blue)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border-bottom:none}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
.in{color:var(--green)}.out{color:var(--red)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;margin-top:10px}
.btn.pri{background:var(--orange);color:#fff}
.btn.sec2{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.wa{background:#25d366;color:#fff}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red-soft)}
.btn.sm{display:inline-block;width:auto;padding:8px 13px;font-size:14px;margin:0;border-radius:10px}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:600;font-size:14.5px}
.banner.warn{background:#fff4e5;color:#8a4b08;border:1px solid #f6d3a8}
.banner.okb{background:var(--green-soft);color:var(--green);border:1px solid #bfe5cf}
.overlay{position:absolute;inset:0;background:rgba(10,15,30,.45);display:flex;align-items:flex-end;z-index:10}
.sheet{background:var(--bg);width:100%;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(22px + var(--sb))}
.grab{width:40px;height:5px;background:#c8ccd5;border-radius:3px;margin:0 auto 10px}
.sheet h4{margin:2px 0 12px;font-size:20px}
.field{margin-bottom:13px}
.field>label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.stepper{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px;width:max-content}
.stepper button{width:44px;height:44px;border-radius:10px;border:none;background:var(--soft);font-size:24px;font-weight:700;cursor:pointer;color:var(--navy)}
.stepper span{min-width:30px;text-align:center;font-weight:800;font-size:19px}
.inp{width:100%;font:inherit;font-size:18px;font-weight:600;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.inp.big{font-size:26px;font-weight:800;direction:ltr;text-align:center}
textarea.inp{font-size:15px;font-weight:500;min-height:80px}
.seg{display:flex;background:#e6e9ef;border-radius:12px;padding:3px}
.seg button{flex:1;border:none;background:none;font:inherit;font-weight:700;padding:11px 4px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:15px}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.flexrow{display:flex;gap:14px;flex-wrap:wrap}
.toast{position:absolute;left:16px;right:16px;bottom:calc(84px + var(--sb));background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;z-index:20;text-align:center}
.modal{position:absolute;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:24px}
.modal div.c{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:360px}
.modal p{margin:0 0 6px;font-size:16.5px;font-weight:600}
.wabubble{background:#d9fdd3;border-radius:12px;padding:11px 12px;font-size:14.5px;white-space:pre-wrap;line-height:1.5;unicode-bidi:plaintext}
.photo{max-width:100%;border-radius:10px;margin-top:8px;display:block}
.countrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.countrow:last-child{border-bottom:none}
.countrow .inp{width:120px;font-size:18px;padding:9px;direction:ltr;text-align:center}
.diff0{color:var(--green);font-weight:800}.diffx{color:var(--red);font-weight:800}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
a.lnk{color:var(--blue)}
</style>
</head>

ws:'حركة',totalIn:'الوارد',totalOut:'المنصرف',net:'الصافي',ok:'مظبوط',guestPay:'دفع ضيوف',\n  generated:'تاريخ الإنشاء',rates:'أسعار الصرف',month:'أكتوبر 2026',guidesH:'المرشد / المساعد',refH:'المندوب / الجهة',trips:'رحلات',guests:'ضيوف',paid:'مدفوع',unpaid:'غير مدفوع',\n  Fuel:'بنزين','Spare parts':'قطع غيار','Repairs & service':'صيانة وتصليح','Guide fee':'أجرة المرشد','Helper fee':'أجرة المساعد',Commission:'عمولة','Camp & tea':'الكامب والشاي','Water & snacks':'مياه وسناكس','Bike wash':'غسيل الباجي','Permits & fees':'تصاريح ورسوم','Owner takes cash':'سحب المالك',\n  Sunrise:'الشروق',Morning:'الصباح',Sunset:'الغروب',Night:'الليل',Canyon:'الكانيون','Bedouin village':'قرية بدوية',Mountain:'الجبل',Lagoon:'اللاجون',\n  EGP:'جنيه',USD:'دولار',EUR:'يورو',cash:'كاش',instapay:'انستاباي',ewallet:'محفظة',footReal:'تم إنشاؤه بواسطة تطبيق روك كواد.','Other':'أخرى',foot:'تم إنشاؤه بواسطة تطبيق روك كواد. بيانات مثال للعرض فقط.'\n};\nlet LANG=D.lang==='ar'?'ar':'en';\nconst t=(k,en)=>LANG==='ar'&&AR[k]!=null?AR[k]:(en!=null?en:k);\nconst fmt=n=>Math.round(n).toLocaleString('en-US');\nconst esc=s=>String(s==null?'':s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst money=(c,n)=>LANG==='ar'?fmt(n)+' '+t(c):c+' '+fmt(n);\nconst egp=(c,n)=>n*(c==='EGP'?1:(+D.rates[c]||0));\nconst tripById={};D.trips.forEach(x=>tripById[x.id]=x);\nconst dayLabel=d=>{const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString(LANG==='ar'?'ar-EG-u-nu-latn':'en-GB',{weekday:'short',day:'numeric',month:'short'});};\n\n// one flat list: guest payments + cash movements\nconst ROWS=[];\nD.groups.forEach(g=>{const tr=tripById[g.trip]||{day:g.paidDay,slot:'',route:'',guide:''};\n  ROWS.push({day:g.paidDay||tr.day,time:g.paidTime||g.time,dir:g.paidDay?'in':'owed',cat:'guest',amt:g.total,cur:g.cur,method:g.method,\n    detail:(g.name||'')+' · '+g.people+'p · '+(g.single?g.single+'×S ':'')+(g.double?g.double+'×D':'')+(g.note?' · '+g.note:''),tripRef:tr,who:g.ref&&g.ref!=='Walk-in'?g.ref:'',egp:egp(g.cur,g.total)});});\nD.cash.forEach(c=>ROWS.push({day:c.day,time:c.time,dir:c.dir,cat:c.cat,amt:c.amt,cur:c.cur,method:c.method,detail:c.note||'',photo:c.photo,tripRef:c.trip?tripById[c.trip]:null,\n  who:c.person||'',egp:egp(c.cur,c.amt)}));\nROWS.sort((a,b)=>(a.day+a.time).localeCompare(b.day+b.time));\nconst CATS=[...new Set(D.cash.filter(c=>c.dir==='out').map(c=>c.cat))];\n\nconst F={q:'',type:'',cat:'',cur:'',day:'',who:''};let SORT={k:'day',asc:true};let LIMIT=60;\n\nfunction sums(rows){const i={EGP:0,USD:0,EUR:0},o={EGP:0,USD:0,EUR:0};let ie=0,oe=0;\n  rows.forEach(r=>{if(r.dir==='in'){i[r.cur]+=r.amt;ie+=r.egp}else if(r.dir==='out'){o[r.cur]+=r.amt;oe+=r.egp}});return {i,o,ie,oe};}\nconst curLine=o=>CUR.filter(c=>o[c]).map(c=>money(c,o[c])).join(' · ')||'0';\n\nfunction kpis(){\n  const s=sums(ROWS.filter(r=>r.cat!=='Owner takes cash'));\n  const guests=D.groups.reduce((a,g)=>a+g.people,0),bikes=D.groups.reduce((a,g)=>a+g.single+g.double,0);\n  const owed=ROWS.filter(r=>r.dir==='owed');const ow={EGP:0,USD:0,EUR:0};owed.forEach(r=>ow[r.cur]+=r.amt);\n  const k=(lbl,val,sub)=>'<div class=\"kpi\"><small>'+lbl+'<\/small><b>'+val+'<\/b><span>'+sub+'<\/span><\/div>';\n  document.getElementById('kpis').innerHTML=\n    k(t('kTrips','Trips'),D.trips.length,D.closes.length+' '+t('kDays','working days'))+\n    k(t('kGuests','Guests'),fmt(guests),fmt(bikes)+' '+t('kBikes','bikes'))+\n    k(t('kIn','Money in'),money('EGP',s.ie),curLine(s.i)+'<br>'+['cash','instapay','ewallet'].map(m=>{const o={EGP:0,USD:0,EUR:0};ROWS.forEach(r=>{if(r.dir==='in'&&(r.method||'cash')===m)o[r.cur]+=r.amt});return CUR.some(c=>o[c])?t(m)+': '+curLine(o):''}).filter(Boolean).join('<br>'))+\n    k(t('kOut','Money out'),money('EGP',s.oe),t('kEgp','EGP equivalent')+(LANG==='ar'?'، بدون سحب المالك':', without owner cash'))+\n    k(t('kNet','Net'),money('EGP',s.ie-s.oe),t('kEgp','EGP equivalent'))+\n    k(t('kOwed','Still owed'),owed.length?curLine(ow):'0',owed.length+(LANG==='ar'?' مجموعة':' groups'));\n}\nfunction chart(){\n  const days=[...new Set(D.closes.map(c=>c.day).concat(ROWS.map(r=>r.day)).filter(Boolean))].sort();const per={};days.forEach(d=>per[d]={i:0,o:0});\n  ROWS.forEach(r=>{if(r.cat==='Owner takes cash')return;if(r.dir==='in')per[r.day].i+=r.egp;else if(r.dir==='out')per[r.day].o+=r.egp;});\n  const max=Math.max(1,...days.map(d=>Math.max(per[d].i,per[d].o)));\n  document.getElementById('chart').innerHTML=days.map(d=>'<div class=\"day'+(F.day===d?' on':'')+'\" data-d=\"'+d+'\" title=\"'+dayLabel(d)+': +'+fmt(per[d].i)+' / −'+fmt(per[d].o)+' EGP\"><div class=\"pair\"><i class=\"in\" style=\"height:'+(per[d].i/max*100)+'%\"><\/i><i class=\"out\" style=\"height:'+(per[d].o/max*100)+'%\"><\/i><\/div><em>'+(+d.slice(8))+'<\/em><\/div>').join('');\n  document.querySelectorAll('.day').forEach(el=>el.onclick=()=>{F.day=F.day===el.dataset.d?'':el.dataset.d;LIMIT=60;draw();document.getElementById('q').scrollIntoView({behavior:'smooth',block:'center'});});\n}\nfunction cats(){\n  const tot={};CATS.forEach(c=>tot[c]=0);ROWS.forEach(r=>{if(r.dir==='out')tot[r.cat]+=r.egp});\n  const list=CATS.filter(c=>c!=='Owner takes cash').sort((a,b)=>tot[b]-tot[a]);const max=Math.max(1,...list.map(c=>tot[c]));\n  document.getElementById('cats').innerHTML=list.map(c=>'<div class=\"hbar'+(F.cat===c?' on':'')+'\" data-c=\"'+c+'\"><span>'+t(c)+'<\/span><div class=\"track\"><div class=\"fill\" style=\"width:'+(tot[c]/max*100)+'%;'+(c==='Owner takes cash'?'background:#9aa3b5':'')+'\"><\/div><\/div><span class=\"v\">'+money('EGP',tot[c])+'<\/span><\/div>').join('')+\n    '<div class=\"hbar'+(F.cat==='Owner takes cash'?' on':'')+'\" data-c=\"Owner takes cash\" style=\"margin-top:8px;border-top:1px solid var(--line);border-radius:0;padding-top:10px\"><span>'+t('Owner takes cash')+'<\/span><span class=\"muted\" style=\"font-size:12.5px\">'+t('ownerNote','To bank / safe, not a cost')+'<\/span><span class=\"v\">'+money('EGP',tot['Owner takes cash'])+'<\/span><\/div>';\n  if(!CATS.includes('Owner takes cash'))document.getElementById('cats').lastElementChild.remove();\n  document.querySelectorAll('.hbar[data-c]').forEach(el=>el.onclick=()=>{F.cat=F.cat===el.dataset.c?'':el.dataset.c;F.type=F.cat?'out':F.type;LIMIT=60;draw();});\n}\nfunction people(){\n  const P={};const add=(name,role,k,v)=>{P[name]=P[name]||{name,role,trips:0,guests:0,paid:0};P[name][k]+=v;};\n  D.trips.forEach(x=>{if(x.guide)add(x.guide,'guide','trips',1);if(x.helper)add(x.helper,'helper','trips',1);});\n  D.cash.forEach(c=>{if(['Guide fee','Helper fee','Commission'].includes(c.cat)&&c.person)add(c.person,c.cat==='Commission'?'ref':(c.cat==='Guide fee'?'guide':'helper'),'paid',c.amt);});\n  D.groups.forEach(g=>{if(g.ref&&g.ref!=='Walk-in')add(g.ref,'ref','guests',g.people);});\n  const row=p=>'<tr class=\"pr'+(F.who===p.name?' on':'')+'\" data-w=\"'+esc(p.name)+'\" style=\"cursor:pointer'+(F.who===p.name?';background:var(--soft)':'')+'\"><td><b>'+esc(p.name)+'<\/b><\/td><td class=\"n\">'+(p.role==='ref'?p.guests+' '+t('guests','guests'):p.trips+' '+t('trips','trips'))+'<\/td><td class=\"n\">'+money('EGP',p.paid)+'<\/td><\/tr>';\n  const g=Object.values(P).filter(p=>p.role!=='ref'),r=Object.values(P).filter(p=>p.role==='ref');\n  document.getElementById('people').innerHTML='<table><thead><tr><th>'+t('guidesH','Guide / helper')+'<\/th><th class=\"n\"><\/th><th class=\"n\">'+t('paid','Paid')+'<\/th><\/tr><\/thead><tbody>'+g.map(row).join('')+'<\/tbody><\/table>'+\n    '<table style=\"margin-top:10px\"><thead><tr><th>'+t('refH','Referrer')+'<\/th><th class=\"n\"><\/th><th class=\"n\">'+t('Commission')+'<\/th><\/tr><\/thead><tbody>'+r.map(row).join('')+'<\/tbody><\/table>';\n  document.querySelectorAll('tr.pr').forEach(el=>el.onclick=()=>{F.who=F.who===el.dataset.w?'':el.dataset.w;LIMIT=60;draw();});\n}\nfunction filtered(){\n  const q=F.q.toLowerCase();\n  return ROWS.filter(r=>(!F.type||r.dir===F.type)&&(!F.cat||r.cat===F.cat)&&(!F.cur||r.cur===F.cur)&&(!F.day||r.day===F.day)&&\n    (!F.who||r.who===F.who||(r.tripRef&&(r.tripRef.guide===F.who||r.tripRef.helper===F.who)))&&\n    (!q||(r.detail+' '+r.who+' '+t(r.cat)+' '+r.cat+' '+(r.tripRef?r.tripRef.slot+' '+r.tripRef.route+' '+r.tripRef.guide:'')).toLowerCase().includes(q)));\n}\nfunction table(){\n  let rows=filtered();\n  const key={day:r=>r.day+r.time,kind:r=>r.cat,detail:r=>r.detail,who:r=>r.who||'',egp:r=>(r.dir==='out'?-1:1)*r.egp}[SORT.k];\n  rows.sort((a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*(SORT.asc?1:-1)});\n  const meth=r=>r.method&&r.method!=='cash'?' <span class=\"pill\" style=\"background:#e6eefc;color:#2b5fc2\">'+t(r.method)+'<\/span>':'';\n  const kind=r=>r.cat==='guest'?(r.dir==='owed'?'<span class=\"pill bad\">'+t('unpaid','Unpaid')+'<\/span> ':'')+t('guestPay','Guest payment'):t(r.cat);\n  document.getElementById('rows').innerHTML=rows.slice(0,LIMIT).map(r=>'<tr class=\"'+r.dir+'\"><td style=\"white-space:nowrap\">'+dayLabel(r.day)+'<div class=\"muted\">'+r.time+'<\/div><\/td><td>'+kind(r)+meth(r)+'<\/td><td>'+esc(r.detail)+(r.photo?'<div><img src=\"'+r.photo+'\" style=\"max-width:120px;border-radius:6px;margin-top:4px;cursor:zoom-in\" onclick=\"this.style.maxWidth=this.style.maxWidth===\\'100%\\'?\\'120px\\':\\'100%\\'\"><\/div>':'')+(r.tripRef?'<div class=\"muted\">'+t(r.tripRef.slot)+' · '+t(r.tripRef.route)+'<\/div>':'')+(r.who?'<span class=\"whoIn\">👤 '+r.who+'<\/span>':'')+'<\/td><td class=\"who\">'+(r.who||'')+'<\/td><td class=\"n amt\">'+(r.dir==='out'?'−':r.dir==='in'?'+':'')+money(r.cur,r.amt)+(r.cur!=='EGP'?'<div class=\"muted\" style=\"font-weight:400\">≈ '+fmt(r.egp)+'<\/div>':'')+'<\/td><\/tr>').join('');\n  const m=document.getElementById('more');m.style.display=rows.length>LIMIT?'block':'none';\n  m.textContent=t('more','Show more')+' ('+(rows.length-LIMIT)+')';\n  const s=sums(rows);\n  document.getElementById('sum').innerHTML='<span><b>'+rows.length+'<\/b> '+t('rows','entries')+'<\/span><span>'+t('totalIn','In')+': <b style=\"color:var(--green)\">'+curLine(s.i)+'<\/b><\/span><span>'+t('totalOut','Out')+': <b style=\"color:var(--red)\">'+curLine(s.o)+'<\/b><\/span><span>'+t('net','Net')+' ≈ <b>'+money('EGP',s.ie-s.oe)+'<\/b><\/span>';\n  const chips=[];if(F.day)chips.push(['day',dayLabel(F.day)]);if(F.who)chips.push(['who',F.who]);\n  document.getElementById('activeChips').innerHTML=chips.map(([k,l])=>'<button class=\"chip\" data-k=\"'+k+'\">'+l+' ✕<\/button>').join(' ');\n  document.querySelectorAll('#activeChips .chip').forEach(el=>el.onclick=()=>{F[el.dataset.k]='';draw();});\n}\nfunction selects(){\n  const opt=(v,l,cur)=>'<option value=\"'+v+'\"'+(cur===v?' selected':'')+'>'+l+'<\/option>';\n  document.getElementById('fType').innerHTML=opt('',t('allTypes','In and out'),F.type)+opt('in',t('inOnly','Money in only'),F.type)+opt('out',t('outOnly','Money out only'),F.type)+opt('owed',t('unpaid','Unpaid'),F.type);\n  document.getElementById('fCat').innerHTML=opt('',t('allCats','All types'),F.cat)+opt('guest',t('guestPay','Guest payment'),F.cat)+CATS.map(c=>opt(c,t(c),F.cat)).join('');\n  document.getElementById('fCur').innerHTML=opt('',t('allCur','All currencies'),F.cur)+CUR.map(c=>opt(c,t(c),F.cur)).join('');\n}\nfunction trips(){\n  document.getElementById('trips').innerHTML=D.trips.map(x=>{const gs=D.groups.filter(g=>g.trip===x.id);const inc={EGP:0,USD:0,EUR:0};gs.forEach(g=>inc[g.cur]+=g.total);\n    const cost=D.cash.filter(c=>c.trip===x.id).reduce((a,c)=>a+egp(c.cur,c.amt),0);\n    return '<tr><td style=\"white-space:nowrap\">'+dayLabel(x.day)+'<\/td><td>'+x.time+' '+t(x.slot)+'<div class=\"muted\">'+t(x.route)+'<\/div><\/td><td>'+x.guide+(x.helper?'<div class=\"muted\">+ '+x.helper+'<\/div>':'')+'<\/td><td class=\"n\">'+gs.reduce((a,g)=>a+g.people,0)+'<\/td><td class=\"n\">'+gs.reduce((a,g)=>a+g.single+g.double,0)+'<\/td><td class=\"n\">'+curLine(inc)+'<\/td><td class=\"n\">'+money('EGP',cost)+'<\/td><\/tr>';}).join('');\n}\nfunction closes(){\n  document.getElementById('closes').innerHTML=D.closes.map(c=>{const d={};CUR.forEach(k=>d[k]=c.counted[k]-c.expected[k]);const bad=CUR.some(k=>d[k]);\n    return '<tr><td style=\"white-space:nowrap\">'+dayLabel(c.day)+'<\/td><td class=\"n\">'+curLine(c.expected)+'<\/td><td class=\"n\">'+curLine(c.counted)+'<\/td><td class=\"n\">'+(bad?'<span class=\"pill bad\">'+CUR.filter(k=>d[k]).map(k=>(d[k]>0?'+':'−')+money(k,Math.abs(d[k]))).join(' ')+'<\/span>':'<span class=\"pill ok\">'+t('ok','OK')+'<\/span>')+'<\/td><td>'+c.closedBy+' · '+c.closedAt+'<\/td><\/tr>';}).join('');\n}\nfunction statics(){\n  document.body.classList.toggle('ar',LANG==='ar');document.documentElement.dir=LANG==='ar'?'rtl':'ltr';document.documentElement.lang=LANG;\n  document.querySelectorAll('[data-t]').forEach(el=>{if(!el.dataset.en)el.dataset.en=el.textContent;el.textContent=t(el.dataset.t,el.dataset.en);});\n  document.querySelectorAll('[data-tp]').forEach(el=>{if(!el.dataset.en)el.dataset.en=el.placeholder;el.placeholder=t(el.dataset.tp,el.dataset.en);});\n  document.getElementById('title').textContent=new Date(D.month+'-15T12:00:00').toLocaleDateString(LANG==='ar'?'ar-EG-u-nu-latn':'en-GB',{month:'long',year:'numeric'});document.title='Rock Quad '+D.month;\n  document.getElementById('gen').textContent=t('generated','Generated')+' '+D.generated.slice(0,10)+' · '+t('rates','Rates')+': USD '+D.rates.USD+', EUR '+D.rates.EUR+' EGP';\n  document.getElementById('langBtn').textContent=LANG==='ar'?'English':'عربي';\n  document.getElementById('foot').textContent=D.example?t('foot','Made by the Rock Quad app. Example data for demonstration only.'):t('footReal','Made by the Rock Quad app.');\n}\nfunction draw(){statics();kpis();chart();cats();people();selects();table();trips();closes();}\ndocument.getElementById('q').oninput=e=>{F.q=e.target.value;LIMIT=60;table();};\ndocument.getElementById('fType').onchange=e=>{F.type=e.target.value;LIMIT=60;draw();};\ndocument.getElementById('fCat').onchange=e=>{F.cat=e.target.value;LIMIT=60;draw();};\ndocument.getElementById('fCur').onchange=e=>{F.cur=e.target.value;LIMIT=60;draw();};\ndocument.getElementById('more').onclick=()=>{LIMIT+=100;table();};\ndocument.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{SORT={k:th.dataset.k,asc:SORT.k===th.dataset.k?!SORT.asc:true};table();});\ndocument.getElementById('langBtn').onclick=()=>{LANG=LANG==='ar'?'en':'ar';draw();};\ndraw();\n})();\n<\/script>\n<\/body>\n<\/html>\n";

/* ---------- storage: IndexedDB, localStorage fallback ---------- */
const store={
  db:null,lsOk:false,
  async open(){
    try{localStorage.setItem('rq_t','1');localStorage.removeItem('rq_t');this.lsOk=true;}catch(e){}
    return new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v)}};
      setTimeout(()=>fin(false),2000); // Safari can leave indexedDB.open hanging: never wait longer than this
      try{const r=indexedDB.open('rockquad',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
        r.onsuccess=()=>{this.db=r.result;fin(true)};r.onerror=()=>fin(false);r.onblocked=()=>fin(false);}catch(e){fin(false)}});},
  async get(){
    let v=null;
    if(this.db){v=await new Promise(res=>{let done=false;const fin=x=>{if(!done){done=true;res(x)}};setTimeout(()=>fin(null),2000);
      try{const q=this.db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>fin(q.result||null);q.onerror=()=>fin(null);}catch(e){fin(null)}});}
    if(v)return v;
    try{return JSON.parse(localStorage.getItem('rockquad')||'null')}catch(e){return null}},
  async put(v){const json=JSON.stringify(v);
    try{localStorage.setItem('rockquad',json)}catch(e){}
    if(this.db){await new Promise(res=>{setTimeout(res,3000);try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(JSON.parse(json),'state');tx.oncomplete=res;tx.onerror=res;tx.onabort=res;}catch(e){res()}});}
  },
  canSave(){return !!(this.db||this.lsOk);}
};

/* ---------- money maths ---------- */
const tripOf=id=>S.trips.find(x=>x.id===id);
const closeOf=d=>S.closes.find(c=>c.day===d&&!c.reopened);
const isClosed=d=>!!closeOf(d);
function openingFor(day){
  const prev=S.closes.filter(c=>c.day<day&&!c.reopened).sort((a,b)=>a.day<b.day?1:-1)[0];
  return prev?{...prev.counted}:{...S.startCash};
}
function dayFigures(day){
  const cashIn=zero(),cashOut=zero(),dig={instapay:zero(),ewallet:zero()},digOut={instapay:zero(),ewallet:zero()},guestIn=zero(),outCat={};
  let guests=0,bikes=0;const trips=S.trips.filter(x=>x.day===day);
  S.groups.forEach(g=>{const tr=tripOf(g.trip);if(tr&&tr.day===day){guests+=g.people;bikes+=g.single+g.double;}
    if(g.paidDay===day){guestIn[g.cur]+=g.total;if(g.method==='cash')cashIn[g.cur]+=g.total;else dig[g.method][g.cur]+=g.total;}});
  S.cash.filter(c=>c.day===day).forEach(c=>{
    if(c.dir==='in'){if(c.method==='cash')cashIn[c.cur]+=c.amt;else dig[c.method][c.cur]+=c.amt;}
    else{if(c.method==='cash')cashOut[c.cur]+=c.amt;else digOut[c.method][c.cur]+=c.amt;
      outCat[c.cat]=outCat[c.cat]||zero();outCat[c.cat][c.cur]+=c.amt;}});
  const opening=openingFor(day),exp=zero();CUR.forEach(c=>exp[c]=(opening[c]||0)+cashIn[c]-cashOut[c]);
  return {trips,guests,bikes,cashIn,cashOut,dig,digOut,guestIn,outCat,opening,exp};
}
const owedGroups=()=>S.groups.filter(g=>!g.paidDay);
const owedComms=()=>S.groups.filter(g=>g.comm>0&&!g.commPaid);
function activeDays(){const s=new Set();S.trips.forEach(x=>s.add(x.day));S.cash.forEach(c=>s.add(c.day));S.groups.forEach(g=>g.paidDay&&s.add(g.paidDay));return [...s].sort();}
function unclosedPast(){const td=today();return activeDays().filter(d=>d<td&&!isClosed(d));}

/* ---------- daily report text ---------- */
function reportText(day,lang){
  const F=dayFigures(day),c=closeOf(day)||S.closes.filter(x=>x.day===day).slice(-1)[0];const ar=lang==='ar';const T=s=>t(s,lang);const M=(o)=>curLine(o,lang);
  const sumObj=(...os)=>{const r=zero();os.forEach(o=>CUR.forEach(k=>r[k]+=o[k]));return r;};
  let s=(ar?'🏍️ روك كواد · التقرير اليومي\n':'🏍️ Rock Quad · Daily report\n')+dayLabel(day,lang)+'\n\n';
  s+=(ar?'الرحلات: ':'Trips: ')+F.trips.length+(F.trips.length?' ('+F.trips.map(x=>T(x.slot)).join(ar?'، ':', ')+')':'')+'\n';
  s+=(ar?'الضيوف: ':'Guests: ')+F.guests+(ar?' · الباجي: ':' · Bikes: ')+F.bikes+'\n\n';
  s+=(ar?'💵 وارد كاش: ':'💵 Cash in: ')+M(F.cashIn)+'\n';
  const ip=F.dig.instapay,ew=F.dig.ewallet;
  if(CUR.some(k=>ip[k]))s+=(ar?'📲 انستاباي: ':'📲 InstaPay: ')+M(ip)+'\n';
  if(CUR.some(k=>ew[k]))s+=(ar?'📱 محفظة: ':'📱 E-wallet: ')+M(ew)+'\n';
  const allOut=sumObj(F.cashOut,F.digOut.instapay,F.digOut.ewallet);
  s+=(ar?'\n💸 المنصرف: ':'\n💸 Money out: ')+M(allOut)+'\n';
  Object.keys(F.outCat).forEach(k=>{s+='  • '+T(k)+': '+M(F.outCat[k])+'\n';});
  if(c){const d=zero();CUR.forEach(k=>d[k]=(c.counted[k]||0)-(c.expected[k]||0));
    s+=(ar?'\n📦 المتوقع في الدرج: ':'\n📦 Expected in box: ')+M(c.expected)+'\n';
    s+=(ar?'✅ المعدود: ':'✅ Counted: ')+M(c.counted)+'\n';
    s+=(ar?'الفرق: ':'Difference: ')+(CUR.every(k=>!d[k])?(ar?'لا يوجد':'none'):CUR.filter(k=>d[k]).map(k=>(d[k]>0?'+':'−')+money(k,Math.abs(d[k]),lang)).join(' · '))+'\n';}
  else s+=(ar?'\n📦 المتوقع في الدرج: ':'\n📦 Expected in box: ')+M(F.exp)+'\n';
  const ow=owedGroups();if(ow.length){const o=zero();ow.forEach(g=>o[g.cur]+=g.total);s+=(ar?'\n⏳ مبالغ متبقية على الضيوف: ':'\n⏳ Still owed by guests: ')+M(o)+' ('+ow.length+')\n';}
  const oc=owedComms();if(oc.length){s+=(ar?'🤝 عمولات مستحقة: ':'🤝 Commissions owed: ')+money('EGP',oc.reduce((a,g)=>a+g.comm,0),lang)+'\n';}
  if(c)s+=(ar?'\nالتقفيل بواسطة: ':'\nClosed by: ')+c.closedBy+' · '+c.closedAt;
  return s;
}
function fullReport(day){const r=S.settings.reportLang;return r==='both'?reportText(day,'ar')+'\n\n———\n\n'+reportText(day,'en'):reportText(day,r);}

  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(x))x=x.replace(/,/g,'');else x=x.replace(/,/g,'.');
  const n=parseFloat(x);return isFinite(n)?n:0;};

    inner=[h('h4',null,t('Take payment now')),h('div',{style:'font-weight:700;margin-bottom:4px'},g.name||t('Guests')),h('div',{class:'amt',style:'font-size:24px;margin-bottom:12px;direction:inherit'},money(g.cur,g.total)),
      h('div',{class:'field'},h('label',null,t('Paid by')),chips(METHODS,s.method,v=>s.method=v)),
      h('button',{class:'btn pri',onclick:()=>{if(isClosed(today()))return;g.method=s.method;g.paidDay=today();g.paidTime=nowTime();save();U.sheet=null;toast(t('Payment recorded'));}},t('Confirm'))];
  }else if(s.type==='cash'){
    const cats=s.dir==='out'?S.settings.catsOut:DEFAULTS.catsIn;const plist=PERSON_CATS[s.cat]?S.settings[PERSON_CATS[s.cat]]:null;
    inner=[h('h4',null,t(s.edit?'Edit entry':'Cash in / out')),
      h('div',{class:'field'},h('div',{class:'seg'},h('button',{class:s.dir==='in'?'on in':'',onclick:()=>{s.dir='in';s.cat=DEFAULTS.catsIn[1];render()}},t('＋ In')),h('button',{class:s.dir==='out'?'on out':'',onclick:()=>{s.dir='out';s.cat=S.settings.catsOut[0];render()}},t('− Out')))),
      h('div',{class:'field'},h('label',null,t('What for')),chips(cats,s.cat,v=>{s.cat=v;s.person='';})),
      plist&&plist.length?h('div',{class:'field'},h('label',null,t('Who')),chips(plist,s.person,v=>s.person=v)):null,
      h('div',{class:'field'},h('label',null,t('Amount')),h('input',{class:'inp big',inputmode:'decimal',placeholder:'0',value:s.amt,oninput:e=>s.amt=e.target.value})),
      h('div',{class:'field'},h('label',null,t('Currency')),chips(CUR,s.cur,v=>s.cur=v)),
      h('div',{class:'field'},h('label',null,t('Paid by')),chips(METHODS,s.method,v=>s.method=v)),
      h('div',{class:'field'},h('label',null,t('Note')),h('input',{class:'inp',value:s.note||'',placeholder:s.cat==='Spare parts'?(L()==='ar'?'مثلاً: تيل فرامل، باجي 4':'e.g. brake pads, bike 4'):'',oninput:e=>s.note=e.target.value})),
      s.dir==='out'?h('div',{class:'field'},h('label',null,t('Receipt photo')),
        s.photo?[h('img',{class:'photo',src:s.photo}),h('button',{class:'btn sec2 sm',style:'margin-top:8px',onclick:()=>{s.photo=null;render();}},t('Remove photo'))]
          :h('button',{class:'btn sec2 sm',onclick:()=>document.getElementById('photoIn').click()},t('📷 Add photo'))):null,
      h('button',{class:'btn pri',onclick:()=>{const a=num(s.amt);if(!a){toast(t('Enter an amount'));return;}
        const data={dir:s.dir,cat:s.cat,amt:a,cur:s.cur,method:s.method,person:s.person||'',note:(s.note||'').trim(),photo:s.dir==='out'?(s.photo||null):null,trip:s.trip||null};
        if(s.edit)Object.assign(S.cash.find(c=>c.id===s.edit),data);else S.cash.push({id:uid(),day:s.day||today(),time:nowTime(),...data});
        save();U.sheet=null;toast(t('Saved')+' · '+money(s.cur,a));}},t('Save')),
      s.edit?h('button',{class:'btn danger',onclick:()=>ask(t('Delete this entry?'),()=>{S.cash=S.cash.filter(c=>c.id!==s.edit);save();U.sheet=null;toast(t('Deleted'));})},t('Delete')):null];
  }
  return h('div',{class:'overlay',onclick:e=>{if(e.target===e.currentTarget)close();}},h('div',{class:'sheet'},h('div',{class:'grab'}),inner));
}
function modal(){const m=U.modal;if(!m)return null;
  return h('div',{class:'modal'},h('div',{class:'c'},h('p',null,m.msg),

document.getElementById('photoIn').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f||!U.sheet)return;
  const img=new Image();const url=URL.createObjectURL(f);img.onload=()=>{const max=1000,k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);U.sheet.photo=c.toDataURL('image/jpeg',0.6);render();};img.src=url;});

/* ---------- files: share or download ---------- */
async function shareFile(name,text,type){
  const file=new File([text],name,{type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true;}}catch(e){if(e&&e.name==='AbortError')return false;}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);return true;
}
async function backup(){const name='rock-quad-backup-'+today()+'.json';
  const ok=await shareFile(name,JSON.stringify({app:'rock-quad-ledger',kind:'full-backup',schema:1,at:new Date().toISOString(),state:S}),'application/json');
  if(ok){S.lastBackup=new Date().toISOString();save();render();}}
function monthData(m){
  const inM=d=>d&&d.slice(0,7)===m;
  const trips=S.trips.filter(x=>inM(x.day));const tids=new Set(trips.map(x=>x.id));
  const groups=S.groups.filter(g=>tids.has(g.trip)||inM(g.paidDay));
  groups.forEach(g=>{if(!tids.has(g.trip)){const tr=tripOf(g.trip);if(tr){trips.push(tr);tids.add(tr.id);}}});
  return {app:'rock-quad-ledger',kind:'month',schema:1,business:'Rock Quad',month:m,generated:new Date().toISOString(),lang:L(),rates:S.settings.rates,
    trips,groups,cash:S.cash.filter(c=>inM(c.day)),closes:S.closes.filter(c=>inM(c.day)&&!c.reopened)};
}
async function monthFile(m){
  try{const tpl=REPORT_TPL;
    const json=JSON.stringify(monthData(m)).replace(/</g,'\\u003c');
    await shareFile('rock-quad-'+m+'.html',tpl.replace('/*DATA*/',()=>json),'text/html');}
  catch(e){toast('Error: '+e.message);}
}
document.getElementById('restoreIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  let txt=await f.text(),d=null;
  try{if(/^\s*</.test(txt)){const m=txt.match(/<script type="application\/json" id="ledger-data">([\s\S]*?)<\/script>/);d=m&&JSON.parse(m[1]);}else d=JSON.parse(txt);}catch(err){d=null;}
  if(!d||d.app!=='rock-quad-ledger'){toast(t('This file is not a Rock Quad backup.'));return;}
  if(d.kind==='full-backup'){ask(t('Replace all data on this phone with this backup?'),()=>{S=migrate(d.state);save();toast(t('Backup restored'));go('today');});return;}
  // month file: add anything this phone does not have yet
  const add=(arr,items,key)=>{const have=new Set(arr.map(x=>x[key]));items.forEach(x=>{if(!have.has(x[key]))arr.push(x);});};
  add(S.trips,d.trips||[],'id');add(S.groups,d.groups||[],'id');add(S.cash,d.cash||[],'id');add(S.closes,d.closes||[],'day');
  save();toast(t('Month data added'));render();
});

/* ---------- boot ---------- */
function migrate(st){st=st||{};st.v=1;st.settings={...DEFAULTS,...(st.settings||{})};st.settings.rates={...DEFAULTS.rates,...(st.settings.rates||{})};
  ['trips','groups','cash','closes'].forEach(k=>st[k]=st[k]||[]);st.startCash=st.startCash||zero();return st;}
function render(){
  const b=app.querySelector('.body');const y=b?b.scrollTop:0;const sh=app.querySelector('.sheet');const sy=sh?sh.scrollTop:0;
  const ae=document.activeElement;const focusKey=ae&&ae.tagName==='INPUT'?[...app.querySelectorAll('input,textarea')].indexOf(ae):-1;
  document.documentElement.lang=L();document.documentElement.dir=L()==='ar'?'rtl':'ltr';
  const views={today:vToday,trip:vTrip,cash:vCash,close:vClose,report:vReport,more:vMore,month:vMonth,settings:vSettings};
  const v=S.setupDone?(views[U.view]||vToday)():vSetup();
  app.replaceChildren(...v,S.setupDone?tabbar():null,sheet(),modal(),U.toast?h('div',{class:'toast'},U.toast):null);
  const nb=app.querySelector('.body');if(nb)nb.scrollTop=y;const ns=app.querySelector('.sheet');if(ns&&sh)ns.scrollTop=sy;
}
(async()=>{
  await store.open();S=migrate(await store.get());
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  render();
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
})();
